name: SafeEject correctness and package

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  release:
    types: [created]

env:
  SWIFT_VERSION: "6.3.3"

jobs:
  library:
    name: Library strict build and tests
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: ${{ env.SWIFT_VERSION }}
      - name: Verify exact toolchain
        run: swift --version | grep -F "Swift version 6.3.3"
      - name: Strict library audit
        working-directory: swift/Packages/SwiftDiskArbitration
        run: >-
          swift test
          -Xswiftc -strict-concurrency=complete
          -Xswiftc -strict-memory-safety
          -Xswiftc -require-explicit-sendable
          -Xswiftc -warnings-as-errors

  plugin:
    name: Plugin tests and release build
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: ${{ env.SWIFT_VERSION }}
      - name: Verify exact toolchain
        run: swift --version | grep -F "Swift version 6.3.3"
      - name: Plugin strict tests
        working-directory: swift-plugin
        # Strict concurrency, strict memory safety, and warnings-as-errors are
        # target-scoped in Package.swift so they are not forced into StreamDeck.
        run: swift test
      - name: Release build
        working-directory: swift-plugin
        run: swift build -c release

  address-sanitizer:
    name: Library Address Sanitizer
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: ${{ env.SWIFT_VERSION }}
      - name: Address Sanitizer tests
        working-directory: swift/Packages/SwiftDiskArbitration
        run: swift test --sanitize=address

  thread-sanitizer:
    name: Library and plugin Thread Sanitizer
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: ${{ env.SWIFT_VERSION }}
      - name: Library Thread Sanitizer tests
        working-directory: swift/Packages/SwiftDiskArbitration
        run: swift test --sanitize=thread
      - name: Plugin Thread Sanitizer tests
        working-directory: swift-plugin
        run: swift test --sanitize=thread

  package:
    name: Export, validate, and package
    needs: [library, plugin, address-sanitizer, thread-sanitizer]
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: ${{ env.SWIFT_VERSION }}
      - name: Install official Stream Deck CLI
        run: npm install -g @elgato/cli
      - name: Export release plugin
        working-directory: swift-plugin
        run: |
          swift build -c release
          swift run -c release org.deverman.ejectalldisks export org.deverman.ejectalldisks \
            --generate-manifest \
            --copy-executable
      - name: Stage assets and assert release metadata
        run: |
          PLUGIN_DIR="$HOME/Library/Application Support/com.elgato.StreamDeck/Plugins/org.deverman.ejectalldisks.sdPlugin"
          cp -R org.deverman.ejectalldisks.sdPlugin/imgs "$PLUGIN_DIR/"
          cp -R org.deverman.ejectalldisks.sdPlugin/ui "$PLUGIN_DIR/"
          cp -R org.deverman.ejectalldisks.sdPlugin/libs "$PLUGIN_DIR/"
          test "$(jq -r '.Version' "$PLUGIN_DIR/manifest.json")" = "4.0.0.0"
          test "$(jq -r '.OS[0].MinimumVersion' "$PLUGIN_DIR/manifest.json")" = "26"
      - name: Official validation and package
        run: |
          PLUGIN_DIR="$HOME/Library/Application Support/com.elgato.StreamDeck/Plugins/org.deverman.ejectalldisks.sdPlugin"
          mkdir -p dist
          streamdeck validate --no-update-check "$PLUGIN_DIR"
          streamdeck pack "$PLUGIN_DIR" --output dist
          if [ -f "dist/org.deverman.ejectalldisks.sdPlugin.streamDeckPlugin" ]; then
            mv "dist/org.deverman.ejectalldisks.sdPlugin.streamDeckPlugin" \
              "dist/org.deverman.ejectalldisks.streamDeckPlugin"
          fi
          test -f dist/org.deverman.ejectalldisks.streamDeckPlugin
      - uses: actions/upload-artifact@v4
        with:
          name: SafeEject-4.0.0
          path: dist/org.deverman.ejectalldisks.streamDeckPlugin
          retention-days: 30
      - name: Attach package to an explicitly created release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/org.deverman.ejectalldisks.streamDeckPlugin
